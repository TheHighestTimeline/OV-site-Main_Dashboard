[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22 ships a native global WebSocket. This is the root-cause fix for the
  # "Node.js 18 detected without native WebSocket support" error that @supabase/
  # realtime-js throws inside its RealtimeClient constructor (which @supabase/
  # supabase-js calls eagerly in createClient) — it was crashing References,
  # Cost, Audio Dump, Booking, every company page, and the Google OAuth flow.
  NODE_VERSION = "22"
  # Pin the Functions Lambda runtime to match the build Node version so the
  # serverless functions also run on Node 22 (not just the build step).
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[functions]
  node_bundler = "esbuild"
  included_files = []

# ── Scheduled functions (2026-07 audit §4 + §7) ──────────────────────────────
# granola-poll: pulls new Granola calls every 15 min → AI parse → review queue.
[functions."granola-poll"]
  schedule = "*/15 * * * *"

# reminders-daily: 7am ET (11:00 UTC) task-due / overdue-next-action digest.
[functions."reminders-daily"]
  schedule = "0 11 * * *"

# weekly-report: Friday 8am ET (12:00 UTC) slippage report (stale deals,
# stuck tasks, overdue contacts).
[functions."weekly-report"]
  schedule = "0 12 * * 5"

# ── Threads tab scheduled jobs (WP3, WP5, WP6, WP11) ─────────────────────────
#
# DELIBERATELY DISABLED ON FIRST DEPLOY. Uncomment each block once you have
# watched that job do one manual run and are happy with what it wrote.
#
# Every one of these is callable over HTTP from Threads > Queues > "Run a scan
# now", so the feature is fully usable without them. They gate on the coo role
# there; scheduled invocations carry no httpMethod and skip the gate, which is
# why each handler checks for it explicitly.
#
# The reason the schedules start off: coo-ingest-gmail writes Activity rows into
# the LIVE Airtable base. Everything else only writes to the new coo_* tables in
# Supabase, so the blast radius of an unattended first run is very different per
# job. Turn them on in this order: drive, then mail signals, then stalled, then
# ingest last.

# coo-signals-scan-drive: the deterministic detector. Diffs each data room's
# Drive permission list against the last snapshot. First run on a folder seeds a
# baseline and fires nothing, so the existing access list does not arrive as a
# wave of false grants. Writes: Supabase only, plus closing tasks it matches.
# [functions."coo-signals-scan-drive"]
#   schedule = "*/15 * * * *"

# coo-signals-scan-gmail: the INFERRED detectors (eSignature completion,
# outbound attachments, access-request mail). These only ever propose; they land
# in the Resolved? queue and change nothing until a human confirms.
# Writes: Supabase only.
# [functions."coo-signals-scan-gmail"]
#   schedule = "0 */2 * * *"

# coo-stalled-scan: 21 days with nothing recorded moves a participation to
# Stalled, and activity on a stalled row returns it to its prior stage.
# Daily at 6am ET (10:00 UTC), before the morning routine.
# Writes: Participations table only. No-ops entirely until that table exists.
# [functions."coo-stalled-scan"]
#   schedule = "0 10 * * *"

# coo-ingest-gmail: normalizes Tanner's mail into coo_threads / coo_messages and
# writes ONE Activity row per thread per day into the live Airtable base. Not
# accounts@, not socials@. This is the only Threads job that writes to the CRM
# unattended, so enable it last and set COO_SCAN_USER_ID first — otherwise it
# falls back to the shared GMAIL_REFRESH_TOKEN account rather than yours.
# [functions."coo-ingest-gmail"]
#   schedule = "*/20 * * * *"

# ── Security headers — Phase 7 audit fix M-10 ───────────────────────────────
# Content-Security-Policy + standard hardening headers applied to every
# response. The CSP allows the dashboard to:
#   - Run inline scripts/styles (required because the codebase uses inline
#     style objects throughout — locking this down further is a Phase 15 cleanup)
#   - Load scripts from Clerk (auth), JSDelivr (Websites iframe CDN), self
#   - Make XHR/fetch to Clerk, Supabase, Anthropic, OpenAI, GitHub, Netlify,
#     Notion, Google APIs
#   - Embed iframes from Netlify (deploy previews) and the dashboard itself
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options             = "SAMEORIGIN"
    X-Content-Type-Options      = "nosniff"
    Referrer-Policy             = "strict-origin-when-cross-origin"
    Permissions-Policy          = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Strict-Transport-Security   = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy     = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.com https://*.clerk.accounts.dev https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.clerk.com https://*.clerk.accounts.dev https://*.supabase.co wss://*.supabase.co https://api.anthropic.com https://api.openai.com https://api.github.com https://raw.githubusercontent.com https://api.netlify.com https://api.notion.com https://www.googleapis.com https://accounts.google.com https://cdn.jsdelivr.net; frame-src 'self' https://*.netlify.app https://*.clerk.com https://*.clerk.accounts.dev https://drive.google.com https://docs.google.com https://*.notion.site https://*.notion.so; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"

# ── Long-term caching for build assets ──────────────────────────────────────
# Vite fingerprints every file in /assets with a content hash (e.g.
# index-a1b2c3d4.js). The filename changes whenever the contents change, so the
# files are safe to cache forever. Without this header the browser re-validates
# every JS/CSS chunk on each repeat visit, adding round-trips on the critical
# path. "immutable" tells the browser not to even revalidate within the year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
